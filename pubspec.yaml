name: image_optimizer
description: "Optimize images by converting it to WebP and choosing the best quality/compression ratio"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  equatable: ^2.0.7
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  hooks: ^2.0.2
  image_picker: ^1.2.1
  logging: ^1.3.0
  native_toolchain_rust: ^1.0.4+0

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

ffigen:
  name: ImageOptimizerFFI
  description: "FFI bindings for the image_optimizer Rust library"
  output: lib/src/ffi.g.dart
  headers:
    entry-points:
      - rust/bindings.h
    include-directives:
      - 'rust/bindings.h'
  functions:
    include:
      - optimize_image_ffi
  comments:
    style: any
    length: full
